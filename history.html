const PER_PAGE = 6;
let currentPage = 1;
let currentFilter = 'all';

function getZoneFromScore(score) {
  if (score < 25) return 'extreme-fear';
  if (score < 45) return 'fear';
  if (score < 55) return 'neutral';
  if (score < 75) return 'greed';
  return 'extreme-greed';
}

function setFilter(zone, btn) {
  currentFilter = zone;
  currentPage = 1;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function render() {
  const filtered = currentFilter === 'all'
    ? COMMENTS
    : COMMENTS.filter(c => {
        const z = getZoneFromScore(c.kr.score);
        if (currentFilter === 'extreme-fear') return z === 'extreme-fear';
        if (currentFilter === 'fear') return z === 'fear';
        if (currentFilter === 'neutral') return z === 'neutral';
        if (currentFilter === 'greed') return z === 'greed' || z === 'extreme-greed';
        return true;
      });

  const totalPages = Math.ceil(filtered.length / PER_PAGE);
  const items = filtered.slice((currentPage - 1) * PER_PAGE, currentPage * PER_PAGE);

  // 통계
  const ef = COMMENTS.filter(c => getZoneFromScore(c.kr.score) === 'extreme-fear').length;
  const f  = COMMENTS.filter(c => getZoneFromScore(c.kr.score) === 'fear').length;
  const n  = COMMENTS.filter(c => getZoneFromScore(c.kr.score) === 'neutral').length;
  const g  = COMMENTS.filter(c => ['greed','extreme-greed'].includes(getZoneFromScore(c.kr.score))).length;
  const avgKr = Math.round(COMMENTS.reduce((s, c) => s + c.kr.score, 0) / COMMENTS.length);
  const avgUs = Math.round(COMMENTS.reduce((s, c) => s + c.us.score, 0) / COMMENTS.length);

  document.getElementById('stats-bar').innerHTML = `
    <div class="stat-card"><div class="stat-num" style="color:#e8edf5;">${COMMENTS.length}</div><div class="stat-label">총 기록일수</div></div>
    <div class="stat-card"><div class="stat-num" style="color:#4a9eff;">${avgUs}</div><div class="stat-label">미국 평균점수</div></div>
    <div class="stat-card"><div class="stat-num" style="color:#ff6b35;">${avgKr}</div><div class="stat-label">한국 평균점수</div></div>
    <div class="stat-card"><div class="stat-num" style="color:#ff2d55;">${ef}</div><div class="stat-label">극단적공포일</div></div>
    <div class="stat-card"><div class="stat-num" style="color:#ff6b35;">${f}</div><div class="stat-label">공포일</div></div>
    <div class="stat-card"><div class="stat-num" style="color:#ffd60a;">${n}</div><div class="stat-label">중립일</div></div>
    <div class="stat-card"><div class="stat-num" style="color:#30d158;">${g}</div><div class="stat-label">탐욕일</div></div>
  `;

  // 코멘트 목록
  document.getElementById('comment-list').innerHTML = items.length === 0
    ? '<p style="color:var(--muted); text-align:center; padding:40px;">해당 조건의 코멘트가 없습니다.</p>'
    : items.map(c => `
      <div class="comment-item">
        <div class="comment-meta">
          <span class="comment-date">${c.date}</span>
          <span class="score-badge" style="color:${c.us.color};">🇺🇸 ${c.us.score} ${c.us.label}</span>
          <span class="score-badge" style="color:${c.kr.color};">🇰🇷 ${c.kr.score} ${c.kr.label}</span>
          ${c.blog ? `<a href="${c.blog}" target="_blank" rel="noopener" class="blog-link">📝 블로그</a>` : ''}
        </div>
        <p class="comment-text">${c.text}</p>
      </div>
    `).join('');

  // 페이지네이션
  document.getElementById('pagination').innerHTML = totalPages <= 1 ? '' :
    Array.from({length: totalPages}, (_, i) => i + 1).map(p =>
      `<button class="page-btn ${p === currentPage ? 'active' : ''}" onclick="goPage(${p})">${p}</button>`
    ).join('');
}

function goPage(p) {
  currentPage = p;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

render();
</script>
