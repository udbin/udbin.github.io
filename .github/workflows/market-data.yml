# 코스피·코스닥 지수 자동 업데이트
# 평일 09:00~16:00(한국시간) KIS API에서 지수를 받아
# market-data 브랜치의 market.json 으로 저장합니다.
# (main 브랜치에는 커밋하지 않으므로 GitHub Pages 재배포가 일어나지 않습니다)
#
# ▶ 5분 주기 실행은 Google Cloud Scheduler가 담당합니다.
#   (Cloud Scheduler → GitHub API workflow_dispatch 호출)
# ▶ 아래 schedule 은 Cloud Scheduler가 멈췄을 때를 대비한 예비용(30분 간격)입니다.

name: 코스피·코스닥 지수 업데이트

on:
  workflow_dispatch:            # Cloud Scheduler 호출 + Actions 탭 수동 실행 버튼
  schedule:
    # 예비용 — GitHub 예약 시간은 UTC 기준 (한국시간 = UTC + 9시간)
    - cron: '17,47 0-6 * * 1-5' # 한국시간 09:17 ~ 15:47, 30분마다
    - cron: '7 7 * * 1-5'       # 한국시간 16:07 (마감 후 최종값)

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 이전 market.json 가져오기
        run: |
          git fetch --depth=1 origin market-data 2>/dev/null \
            && git show origin/market-data:market.json > prev.json 2>/dev/null \
            || echo "이전 데이터 없음 (첫 실행)"

      - name: 저장된 접근토큰 불러오기 (암호화 상태)
        uses: actions/cache/restore@v4
        with:
          path: .kis-token.enc
          key: kis-token-${{ github.run_id }}
          restore-keys: kis-token-

      - name: KIS에서 지수 조회
        id: fetch
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          mkdir -p out
          node scripts/fetch-market.mjs out/market.json prev.json

      - name: 새 접근토큰 저장 (발급했을 때만)
        if: steps.fetch.outputs.token_refreshed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .kis-token.enc
          key: kis-token-${{ github.run_id }}

      - name: market-data 브랜치에 올리기
        if: steps.fetch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b market-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market.json
          git commit -q -m "market: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" market-data
          echo "✅ market-data 브랜치 업데이트 완료"
